<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🧠 Multi-Step Word Problems | 3rd & 4th Grade</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #f97316;
      --primary-light: #fb923c;
      --secondary: #0d9488;
      --accent: #8b5cf6;
      --success: #059669;
      --warning: #d97706;
      --error: #dc2626;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-600: #4b5563;
      --gray-800: #1f2937;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-sm: 0 4px 6px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 20px rgba(0,0,0,0.06);
      --transition: 0.2s ease;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #fff7ed 0%, #f0fdfa 50%, #f5f3ff 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(18px);
      border-radius: 2.5rem;
      padding: 2rem 2.2rem;
      box-shadow: var(--shadow-md), 0 20px 35px rgba(249,115,22,0.08);
      border: 1px solid rgba(255,255,255,0.7);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(to right, #f97316, #0d9488);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .subtitle {
      color: #4b5563;
      font-weight: 500;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .difficulty-tabs {
      display: flex;
      gap: 0.8rem;
      margin: 1.8rem 0 1.5rem;
      flex-wrap: wrap;
    }

    .diff-btn {
      background: white;
      border: 1.5px solid var(--gray-200);
      border-radius: 2.5rem;
      padding: 0.7rem 1.8rem;
      font-weight: 600;
      font-size: 1rem;
      color: var(--gray-600);
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #ffffff;
      box-shadow: var(--shadow-sm);
      flex: 1;
      justify-content: center;
    }

    .diff-btn:hover {
      border-color: var(--primary-light);
      transform: translateY(-2px);
    }

    .diff-btn.active {
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: white;
      border-color: transparent;
      box-shadow: 0 10px 15px rgba(249,115,22,0.3);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: #f8fafc;
      padding: 1rem 1.4rem;
      border-radius: 2rem;
      margin-bottom: 2rem;
    }

    select, .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      border: 1px solid var(--gray-300);
      font-weight: 600;
      background: white;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(249,115,22,0.25);
    }

    .btn-primary:hover {
      background: #ea580c;
    }

    .problem-grid {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin: 1.8rem 0;
    }

    .problem-card {
      background: white;
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }

    .prob-header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .prob-num {
      background: #ffedd5;
      color: #c2410c;
      font-weight: 800;
      width: 2.2rem;
      height: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1rem;
    }

    .prob-text {
      font-weight: 600;
      font-size: 1.15rem;
      color: #1f2937;
      flex: 1;
      line-height: 1.4;
    }

    .answer-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-left: 3.2rem;
    }

    .blank-input {
      width: 180px;
      padding: 0.5rem 0.8rem;
      border: 2px dashed var(--gray-300);
      border-radius: 1rem;
      font-weight: 600;
      font-size: 1.1rem;
      background: #f9fafb;
      transition: 0.2s;
    }

    .blank-input:focus {
      border-color: var(--primary);
      outline: none;
      background: #fff7ed;
    }

    .feedback-text {
      font-size: 0.9rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }

    .correct-fb { color: var(--success); }
    .wrong-fb { color: var(--error); }

    .info-box {
      background: #fef9c3;
      border-left: 5px solid var(--warning);
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      margin: 1rem 0 1.8rem;
      font-weight: 500;
    }


    .control-group {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .floating-check-wrap {
      position: fixed;
      right: 1.2rem;
      bottom: 1.2rem;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      pointer-events: none;
    }

    .floating-check-wrap .btn {
      pointer-events: auto;
      padding: 0.85rem 1.3rem;
      border-radius: 999px;
      font-size: 1rem;
    }

    #globalMessage {
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--gray-200);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      box-shadow: var(--shadow-sm);
      font-weight: 700;
      color: var(--gray-800);
      max-width: min(90vw, 420px);
      text-align: right;
    }

    .data-error {
      background: #fee2e2;
      border-left: 5px solid var(--error);
      color: #991b1b;
    }

    @media (max-width: 600px) {
      .container { padding: 1.2rem; }
      .prob-text { font-size: 1rem; }
      .answer-area { margin-left: 0; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📝 Multi-Step Word Problems</h1>
  <div class="subtitle">Late 3rd · Early 4th Grade | Choose your challenge</div>

  <!-- Difficulty Level Tabs -->
  <div class="difficulty-tabs" id="difficultyTabs">
    <button class="diff-btn active" data-diff="easy">🌱 <span>Easy</span></button>
    <button class="diff-btn" data-diff="medium">🌿 <span>Medium</span></button>
    <button class="diff-btn" data-diff="hard">🌳 <span>Hard</span></button>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="dataFileSelect">🗂️ Set:</label>
      <select id="dataFileSelect">
        <option value="word-problems-data.js" selected>word-problems-data.js</option>
        <option value="word-problems-data2.js">word-problems-data2.js</option>
        <option value="word-problems-data3.js">word-problems-data3.js</option>
      </select>
    </div>
    <div class="control-group">
      <label for="problemCount">📋 Problems:</label>
      <select id="problemCount">
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="8">8</option>
      </select>
    </div>
    <button class="btn btn-primary" id="newSetBtn">🔄 New Set</button>
  </div>

  <div id="topicInfo" class="info-box">
    💡 <strong>Easy:</strong> Two-step problems with smaller numbers. Read carefully and show your work!
  </div>

  <div id="problemsContainer" class="problem-grid"></div>

  <div class="floating-check-wrap">
    <div id="globalMessage" aria-live="polite"></div>
    <button class="btn btn-primary" id="checkAllBtn">✅ Check Answered</button>
  </div>
</div>

<!-- Script will load problems from whichever external file is selected -->
<script type="module">
  (function() {
    // ----- State -----
    let currentDifficulty = 'easy';
    let currentProblems = [];
    let problemsData = {};

    const difficultyInfo = {
      easy: "🌱 <strong>Easy:</strong> Two-step problems with numbers up to 50. Great for building confidence!",
      medium: "🌿 <strong>Medium:</strong> Two or three steps with larger numbers. Think before you calculate!",
      hard: "🌳 <strong>Hard:</strong> Three or more steps, mixed operations. You're a problem-solving champion!"
    };

    // ----- Helpers -----
    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const globalMessage = document.getElementById('globalMessage');
    const topicInfo = document.getElementById('topicInfo');

    function normalizeAnswer(str) {
      return str.replace(/\s+/g, ' ').trim().toLowerCase();
    }

    async function loadProblemsFile(filename) {
      try {
        topicInfo.classList.remove('data-error');
        topicInfo.innerHTML = `Loading ${filename}...`;
        globalMessage.innerText = '';

        // Cache-buster lets GitHub Pages pick up newly edited data files faster.
        const mod = await import(`./${filename}?v=${Date.now()}`);
        problemsData = mod.problemsData || mod.default || {};

        if (!problemsData.easy && !problemsData.medium && !problemsData.hard) {
          throw new Error('No easy, medium, or hard lists found.');
        }

        updateUI();
      } catch (err) {
        problemsData = {};
        currentProblems = [];
        renderProblems();
        topicInfo.classList.add('data-error');
        topicInfo.innerHTML = `Could not load <strong>${filename}</strong>. Make sure it is in the same folder and exports <code>problemsData</code>.`;
        globalMessage.innerText = '';
        console.error(err);
      }
    }

    function getProblemsByDifficulty(difficulty) {
      const allProblems = problemsData[difficulty] || problemsData.easy || [];
      return shuffle(allProblems);
    }

    function updateUI() {
      topicInfo.classList.remove('data-error');
      topicInfo.innerHTML = difficultyInfo[currentDifficulty];
      document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.diff === currentDifficulty);
      });
      generateNewSet();
    }

    function generateNewSet() {
      const count = parseInt(document.getElementById('problemCount').value, 10);
      const shuffledPool = getProblemsByDifficulty(currentDifficulty);
      currentProblems = shuffledPool.slice(0, count);
      renderProblems();
      globalMessage.innerText = '';
    }

    function renderProblems() {
      const container = document.getElementById('problemsContainer');
      if (!currentProblems.length) {
        container.innerHTML = '<p style="text-align:center; color:gray;">No problems loaded. Check the selected data file.</p>';
        return;
      }
      container.innerHTML = currentProblems.map((p, idx) => {
        return `
          <div class="problem-card" data-index="${idx}">
            <div class="prob-header">
              <div class="prob-num">${idx+1}</div>
              <div class="prob-text">${p.text}</div>
            </div>
            <div class="answer-area">
              <label style="font-weight:600;" for="ans${idx}">Your answer:</label>
              <input class="blank-input" id="ans${idx}" placeholder="e.g. 39 stickers" data-index="${idx}" autocomplete="off">
              <span class="feedback-text" id="fb${idx}"></span>
            </div>
          </div>
        `;
      }).join('');
    }

    function checkAll() {
      let checkedCount = 0;
      let correctCount = 0;
      let blankCount = 0;

      currentProblems.forEach((p, idx) => {
        const input = document.getElementById(`ans${idx}`);
        const fb = document.getElementById(`fb${idx}`);
        if (!input || !fb) return;

        const userAnswer = normalizeAnswer(input.value);

        // Do not mark or grade blank answers.
        if (userAnswer === '') {
          blankCount++;
          input.style.border = '2px dashed #d1d5db';
          fb.innerHTML = '';
          fb.className = 'feedback-text';
          return;
        }

        checkedCount++;
        const acceptableAnswers = (p.answers || []).map(a => normalizeAnswer(String(a)));
        const isCorrect = acceptableAnswers.includes(userAnswer);

        if (isCorrect) {
          correctCount++;
          input.style.border = '2px solid #059669';
          fb.innerHTML = '✅';
          fb.className = 'feedback-text correct-fb';
        } else {
          input.style.border = '2px solid #dc2626';
          fb.innerHTML = '❌ Try again';
          fb.className = 'feedback-text wrong-fb';
        }
      });

      if (checkedCount === 0) {
        globalMessage.innerText = 'Answer at least one problem first.';
      } else if (blankCount > 0) {
        globalMessage.innerText = `${correctCount}/${checkedCount} answered correct · ${blankCount} blank`;
      } else {
        globalMessage.innerText = `${correctCount}/${checkedCount} answered correct`;
      }
    }

    // Event Listeners
    document.getElementById('difficultyTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.diff-btn');
      if (!btn) return;
      currentDifficulty = btn.dataset.diff;
      updateUI();
    });

    document.getElementById('dataFileSelect').addEventListener('change', (e) => {
      loadProblemsFile(e.target.value);
    });

    document.getElementById('newSetBtn').addEventListener('click', generateNewSet);
    document.getElementById('checkAllBtn').addEventListener('click', checkAll);
    document.getElementById('problemCount').addEventListener('change', generateNewSet);

    // Allow Enter key to trigger check on input fields.
    document.getElementById('problemsContainer').addEventListener('keypress', (e) => {
      if (e.target.classList.contains('blank-input') && e.key === 'Enter') {
        document.getElementById('checkAllBtn').click();
      }
    });

    // Init
    loadProblemsFile(document.getElementById('dataFileSelect').value);
  })();
</script>
</body>
</html>
