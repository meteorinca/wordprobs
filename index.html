<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Step Math Word Problems</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 0 auto;
      padding: 30px 18px 100px;
      line-height: 1.5;
      background: #f7f7fb;
      color: #222;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .problem {
      background: white;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input {
      width: 180px;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    .result {
      margin-left: 10px;
      font-weight: bold;
    }

    .correct {
      color: green;
    }

    .wrong {
      color: crimson;
    }

    #checkAll {
      position: fixed;
      right: 22px;
      bottom: 22px;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      background: #1f5cff;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    #checkAll:hover {
      background: #1547c7;
    }

    #score {
      position: fixed;
      left: 22px;
      bottom: 28px;
      background: white;
      padding: 12px 16px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Multi-Step Math Word Problems</h1>

  <div id="problems"></div>

  <div id="score">Score: 0 / 15</div>
  <button id="checkAll" onclick="checkAll()">Check All</button>

  <script>
    const problems = [
      {
        text: "1. Maya has 6 packs of stickers. Each pack has 12 stickers. She gives 15 stickers to her brother and 18 stickers to her friend. How many stickers does Maya have left?",
        answers: ["39", "39 stickers"]
      },
      {
        text: "2. There are 84 students going on a field trip. Each bus holds 28 students. The school already has 2 buses reserved. How many more buses do they need?",
        answers: ["1", "1 bus", "1 more bus"]
      },
      {
        text: "3. A garden is 12 feet long and 8 feet wide. A smaller square flower bed inside it is 3 feet on each side. How much garden space is left outside the flower bed?",
        answers: ["87", "87 square feet", "87 sq ft"]
      },
      {
        text: "4. There are 5 pizzas. Each pizza has 8 slices. The students eat 27 slices. How many slices are left?",
        answers: ["13", "13 slices"]
      },
      {
        text: "5. Jordan has $50. He buys 3 notebooks for $4 each and a backpack for $23. How much money does he have left?",
        answers: ["15", "$15", "15 dollars"]
      },
      {
        text: "6. Ava reads 18 pages on Monday, 24 pages on Tuesday, and 16 pages on Wednesday. Her book has 90 pages. How many pages does she still need to read?",
        answers: ["32", "32 pages"]
      },
      {
        text: "7. A rectangular dog park is 18 meters long and 9 meters wide. Workers put a gate that is 3 meters wide on one side, so they do not need fence there. How many meters of fencing do they need?",
        answers: ["51", "51 meters", "51 m"]
      },
      {
        text: "8. Soccer practice starts at 4:20 PM and lasts 1 hour 35 minutes. After practice, Leo spends 25 minutes walking home. What time does Leo get home?",
        answers: ["6:20", "6:20 pm", "6:20pm", "6:20 PM"]
      },
      {
        text: "9. A library has 4 shelves. Each shelf has 36 books. The librarian adds 28 more books, then removes 17 damaged books. How many books are there now?",
        answers: ["155", "155 books"]
      },
      {
        text: "10. Adult tickets cost $12 each. Child tickets cost $7 each. A family buys 2 adult tickets and 3 child tickets. They pay with $60. How much change do they get?",
        answers: ["15", "$15", "15 dollars"]
      },
      {
        text: "11. A teacher has 96 pencils. She gives each student 4 pencils. After giving pencils to the class, she has 20 pencils left. How many students got pencils?",
        answers: ["19", "19 students"]
      },
      {
        text: "12. Rafael draws a rectangle that is 14 inches long and 9 inches wide. His sister draws one that is 12 inches long and 11 inches wide. Whose rectangle has the greater area, and how much greater is it?",
        answers: ["sister by 6", "sister, by 6", "sister 6", "sister by 6 square inches", "sister by 6 sq in"]
      },
      {
        text: "13. A class bakes 8 trays of brownies. Each tray has 15 brownies. They sell 86 brownies and give 12 brownies to teachers. How many brownies are left?",
        answers: ["22", "22 brownies"]
      },
      {
        text: "14. A rope is 120 inches long. Sam cuts off 3 pieces that are each 18 inches long. Then he cuts the rest into 6 equal pieces. How long is each of the 6 equal pieces?",
        answers: ["11", "11 inches", "11 in"]
      },
      {
        text: "15. A school has 5 classrooms. Each classroom has 24 students. For an assembly, students sit in rows of 10. How many full rows can they make, and how many students are left over?",
        answers: ["12 full rows, 0 left", "12 rows 0 left", "12 rows 0", "12 full rows and 0 left over", "12"]
      }
    ];

    const container = document.getElementById("problems");

    problems.forEach((problem, index) => {
      const div = document.createElement("div");
      div.className = "problem";
      div.innerHTML = `
        <p>${problem.text}</p>
        <input id="answer-${index}" placeholder="Your answer" />
        <span id="result-${index}" class="result"></span>
      `;
      container.appendChild(div);
    });

    function cleanAnswer(answer) {
      return answer
        .toLowerCase()
        .replace(/\$/g, "")
        .replace(/\./g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function checkAll() {
      let score = 0;

      problems.forEach((problem, index) => {
        const input = document.getElementById(`answer-${index}`);
        const result = document.getElementById(`result-${index}`);

        const userAnswer = cleanAnswer(input.value);
        const correctAnswers = problem.answers.map(cleanAnswer);

        if (correctAnswers.includes(userAnswer)) {
          result.textContent = "Correct";
          result.className = "result correct";
          score++;
        } else {
          result.textContent = "Try again";
          result.className = "result wrong";
        }
      });

      document.getElementById("score").textContent = `Score: ${score} / ${problems.length}`;
    }
  </script>

</body>
</html>
